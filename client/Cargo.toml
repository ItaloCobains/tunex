[package]
name = "tunex-client"
version = "0.1.0"
edition = "2021"

[dependencies]
clap = { version = "4", features = ["derive"] }
tokio = { version = "1", features = ["rt-multi-thread", "macros", "net", "sync", "time"] }
serde_json = "1.0"
tunex-common = { path = "../crates/tunex-common" }
reqwest = { version = "0.12", features = ["json"] }
